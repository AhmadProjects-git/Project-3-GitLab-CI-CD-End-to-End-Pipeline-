stages:
  - test
  - build

test_job:
  stage: test
  tags:
    - my-runner
  script:
    - echo "=== Starting Continuous Integration Tests ==="
    - ls -la
    - test -f index.html && echo "index.html exists!"

build_job:
  stage: build
  tags:
    - my-runner
  script:
    - echo "=== Building Production Code ==="
    - mkdir -p dist
    - cp -r css js index.html dist/ 2>/dev/null || cp index.html dist/
  artifacts:
    paths:
      - dist/
