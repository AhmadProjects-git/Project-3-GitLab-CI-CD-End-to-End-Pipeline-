stages:
  - test
  - build

test_job:
  stage: test
  tags:
    - my-runner
  script:
    - echo "=== Starting Continuous Integration Tests ==="
    - ls -la
    - test -f package.json && echo "package.json verified successfully!"

build_job:
  stage: build
  tags:
    - my-runner
  script:
    - echo "=== Building Production Code ==="
    - test -d dist && echo "Dist folder exists" || mkdir -p dist
  artifacts:
    paths:
      - dist/
